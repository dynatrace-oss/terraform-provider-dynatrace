name: Tests
# Runs the shared test suite (unit, lint, schema-support, integration, sonar) on every push.
# Test results are not collected. See nightly_tests.yml for a nightly run that collects results and ingests them to Dynatrace.
on:
  push:
    branches:
      - '**'
jobs:
  suite:
    uses: ./.github/workflows/_test-suite.yml
    # SFM_PLATFORM_URL and SFM_PLATFORM_TOKEN are omitted - this workflow does not collect results.
    secrets:
      DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
      DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
      DT_CLIENT_ID: ${{ secrets.DT_CLIENT_ID }}
      DT_CLIENT_SECRET: ${{ secrets.DT_CLIENT_SECRET }}
      DT_ACCOUNT_ID: ${{ secrets.DT_ACCOUNT_ID }}
      DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT: ${{ secrets.DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT }}
      DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT: ${{ secrets.DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
