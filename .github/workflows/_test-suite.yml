name: Test Suite

# Reusable pipeline shared by tests.yml and nightly-tests.yml.
# This pipeline
#  - runs the unit tests and create coverage report
#  - runs static code analysis (linting)
#  - runs integration tests in parallel chunks
#  - reports the code coverage and linting errors to Sonar
#  - collects all test results and ingests them to Dynatrace (if collect-results is true)
#
on:
  workflow_call:
    inputs:
      collect-results:
        description: 'Collect JUnit results across all test jobs and ingest them to Dynatrace'
        type: boolean
        default: false
    secrets:
      DYNATRACE_ENV_URL:
        description: 'Environment URL of the Dynatrace tenant the tests run against'
        required: true
      DYNATRACE_API_TOKEN:
        description: 'API token for the Dynatrace tenant the tests run against'
        required: true
      DT_CLIENT_ID:
        description: 'OAuth client ID used by the platform resources under test'
        required: true
      DT_CLIENT_SECRET:
        description: 'OAuth client secret used by the platform resources under test'
        required: true
      DT_ACCOUNT_ID:
        description: 'Account ID used by the account management resources under test'
        required: true
      DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT:
        description: 'GCP service account that cannot be impersonated, used by the GCP integration tests'
        required: true
      DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT:
        description: 'GCP service account that can be impersonated, used by the GCP integration tests'
        required: true
      SONAR_TOKEN:
        description: 'Token for publishing coverage and lint results to SonarQube'
        required: true
      SFM_PLATFORM_URL:
        description: 'Platform URL the collected test results are ingested to. Only required when collect-results is true'
        required: false
      SFM_PLATFORM_TOKEN:
        description: 'Platform token for ingesting the collected test results. Only required when collect-results is true'
        required: false

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: 🛠️ Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: ./go.mod

      - name: 📊 Install gotestsum
        run: go install gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f #v1.13.0

      - name: Run Unit Tests
        env:
          GOPROXY: "https://proxy.golang.org"
        run: |
          mkdir -p test-results/unit
          gotestsum --junitfile test-results/unit/test-results.xml --format testdox --format-icons hivis -- -coverprofile=cov.out -tags=unit -v ./...

      - name: ⬆️ Archive unit test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: ${{ always() && inputs.collect-results }}
        with:
          name: junit-results-unit
          path: test-results

      - name: ⬆️ Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: code-coverage-report
          path: cov.out

  validate-schema-support:
    name: Validate Settings Schema Support
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: 🛠️ Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: ./go.mod

      - name: 🔎 Validate settings schemas are covered in supported-resources.md
        run: go run ./tools/schemasupport/

  lint:
    name: Run Static Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: ⬇️ Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: 🛠️ Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: ./go.mod

      - name: 🧑‍🔧 Check for `go fix` changes
        run: |
          go fix -tags "unit integration" ./...
          git diff --exit-code
        if: always()

      - name: 🔎 golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a #v9.3.0
        if: always()
        with:
          install-mode: 'goinstall' # install mode goinstall in order to use hashes for the version
          version: eabc2638a66daf5bb6c6fb052a32fa3ef7b6600d #v2.1.6
          args: '--output.checkstyle.path=lint-report.xml --issues-exit-code=0' # if issues are found, don't exit with "1". Sonar decides if it fails or not

      - name: ⬆️ Archive lint results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: lint-report
          path: lint-report.xml

  run-setup:
    name: Run Integration Setup
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: 🛠️ Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_wrapper: false

      - name: 🚀 Integration Setup - Terraform Init
        working-directory: ./testsetup
        run: terraform init

      - name: 🚀 Integration Setup - Terraform Apply
        working-directory: ./testsetup
        env:
          TF_VAR_DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          TF_VAR_DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
        run: terraform apply -auto-approve

  integration-tests:
    name: Integration Tests - ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    needs: [ run-setup ]
    strategy:
      fail-fast: false
      matrix:
        # several tests are split into chunks with about 20 tests
        # A dynamic matrix can't be used because there is a limit of 256 entries
        config:
          - { name: "app", slug: "app", path: "./dynatrace/api/app/..." }
          - { name: "automation", slug: "automation", path: "./dynatrace/api/automation/..." }
          - { name: "cluster", slug: "cluster", path: "./dynatrace/api/cluster/..." }
          - { name: "documents", slug: "documents", path: "./dynatrace/api/documents/..." }
          - { name: "extensions", slug: "extensions", path: "./dynatrace/api/extensions/..." }
          - { name: "grail", slug: "grail", path: "./dynatrace/api/grail/..." }
          - { name: "iam", slug: "iam", path: "./dynatrace/api/iam/..." }
          - { name: "openpipeline", slug: "openpipeline", path: "./dynatrace/api/openpipeline/..." }
          - { name: "platform", slug: "platform", path: "./dynatrace/api/platform/..." }
          - { name: "service", slug: "service", path: "./dynatrace/api/service/..." }
          - { name: "slo", slug: "slo", path: "./dynatrace/api/slo/..." }
          - { name: "v1 (a-d)", slug: "v1-a-d", path: "$(go list ./dynatrace/api/v1/config/... | grep -E '^.+/dynatrace/api/v1/config/[a-d][^/]*/?')" }
          - { name: "v1 (e-z)", slug: "v1-e-z", path: "$(go list ./dynatrace/api/v1/config/... | grep -E '^.+/dynatrace/api/v1/config/[e-z][^/]*/?')" }
          - { name: "v2", slug: "v2", path: "./dynatrace/api/v2/..." }
          - { name: "builtin (a-b)", slug: "builtin-a-b", path: "$(go list ./dynatrace/api/builtin/... | grep -E '^.+/dynatrace/api/builtin/[a-b][^/]*/?')" }
          - { name: "builtin (c-e)", slug: "builtin-c-e", path: "$(go list ./dynatrace/api/builtin/... | grep -E '^.+/dynatrace/api/builtin/[c-e][^/]*/?')" }
          - { name: "builtin (f-m)", slug: "builtin-f-m", path: "$(go list ./dynatrace/api/builtin/... | grep -E '^.+/dynatrace/api/builtin/[f-m][^/]*/?')" }
          - { name: "builtin (n-o)", slug: "builtin-n-o", path: "$(go list ./dynatrace/api/builtin/... | grep -E '^.+/dynatrace/api/builtin/[n-o][^/]*/?')" }
          - { name: "builtin (p-s)", slug: "builtin-p-s", path: "$(go list ./dynatrace/api/builtin/... | grep -E '^.+/dynatrace/api/builtin/[p-s][^/]*/?')" }
          - { name: "builtin (t-z)", slug: "builtin-t-z", path: "$(go list ./dynatrace/api/builtin/... | grep -E '^.+/dynatrace/api/builtin/[t-z][^/]*/?')" }
          - { name: "data sources", slug: "data-sources", path: "./datasources/..." }
    steps:
      - name: ⬇️ Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: 🛠️ Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: ./go.mod

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_wrapper: false

      - name: 📊 Install gotestsum
        run: go install gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f #v1.13.0

      - name: Run Integration Tests - ${{ matrix.config.name }}
        if: success() || failure()
        env:
          GOPROXY: "https://proxy.golang.org"
          TF_ACC: "true"
          DYNATRACE_DEBUG: "true"
          DYNATRACE_HTTP_OAUTH_PREFERENCE: "true"
          DT_NO_REPAIR_INPUT: "false"
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DT_CLIENT_ID: ${{ secrets.DT_CLIENT_ID }}
          DT_CLIENT_SECRET: ${{ secrets.DT_CLIENT_SECRET }}
          DT_ACCOUNT_ID: ${{ secrets.DT_ACCOUNT_ID }}
          TF_VAR_DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT: ${{ secrets.DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT }}
          TF_VAR_DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT: ${{ secrets.DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p test-results/${{ matrix.config.slug }}
          gotestsum --junitfile test-results/${{ matrix.config.slug }}/test-results.xml --format testdox --format-icons hivis -- -tags="integration monitored connector" -v -p 1 ${{ matrix.config.path }}

      - name: ⬆️ Archive e2e test results - ${{ matrix.config.name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: ${{ always() && inputs.collect-results }}
        with:
          name: junit-results-${{ matrix.config.slug }}
          path: test-results

  sequential-integration-tests:
    name: Sequential Integration Tests
    runs-on: ubuntu-latest
    needs: [ run-setup ]
    concurrency:
      group: sequential-integration-tests # only one run at a time, globally
      cancel-in-progress: false # queue, don't cancel
    steps:
      - name: ⬇️ Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: 🛠️ Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: ./go.mod

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_wrapper: false

      - name: 📊 Install gotestsum
        run: go install gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f #v1.13.0

      - name: Run Integration Tests - Sequential
        if: success() || failure()
        env:
          GOPROXY: "https://proxy.golang.org"
          TF_ACC: "true"
          DYNATRACE_DEBUG: "true"
          DYNATRACE_HTTP_OAUTH_PREFERENCE: "true"
          DT_NO_REPAIR_INPUT: "false"
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DT_CLIENT_ID: ${{ secrets.DT_CLIENT_ID }}
          DT_CLIENT_SECRET: ${{ secrets.DT_CLIENT_SECRET }}
          DT_ACCOUNT_ID: ${{ secrets.DT_ACCOUNT_ID }}
          TF_VAR_DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT: ${{ secrets.DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT }}
          TF_VAR_DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT: ${{ secrets.DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p test-results/sequential
          gotestsum --junitfile test-results/sequential/test-results.xml --format testdox --format-icons hivis -- -tags="sequential_integration monitored connector" -v -p 1 ./...

      - name: ⬆️ Archive e2e test results - Sequential
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: ${{ always() && inputs.collect-results }}
        with:
          name: junit-results-sequential
          path: test-results

  collect-test-results:
    name: Collect Test Results
    if: ${{ always() && inputs.collect-results }} # always run so failures are collected even when test jobs fail
    needs: [ unit-tests, integration-tests, sequential-integration-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: 🛠️ Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: ./go.mod

      - name: ⬇️ Download all test result artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          pattern: junit-results-*
          path: junit-results
          merge-multiple: true

      - name: 🧮 Collect test results
        env:
          JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: go run ./tools/testresults --input junit-results --output test-report.json

      - name: 📡 Send test results to Dynatrace
        if: always()
        uses: ./.github/actions/send-test-result-events
        with:
          platform_url: ${{ secrets.SFM_PLATFORM_URL }}
          platform_token: ${{ secrets.SFM_PLATFORM_TOKEN }}
          events_path: 'custom/events.sdlc/cacapiingest'
          tests_file: test-report.json

      - name: ⬆️ Archive test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: test-results
          path: test-report.json

  sonar_scan:
    name: SonarQube lint and test coverage
    if: ${{ always() }} # always runs after lint and test have completed, regardless of whether they were successful
    needs: [ unit-tests, lint ]
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0

      - name: ⬇️ Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: code-coverage-report

      - name: ⬇️ Download lint artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: lint-report

      - name: 🏷️ Get latest tag
        id: get_latest_tag
        run: |
          echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: 🔍 SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # nosemgrep false detection of commit v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            "-Dsonar.projectVersion=${{steps.get_latest_tag.outputs.GIT_TAG}}"
