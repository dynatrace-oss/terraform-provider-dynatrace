name: Platform Token Tests
# Runs the integration tests of the shared test suite on every push, authenticating with a
# platform token instead of an API token. Unit tests, linting and the Sonar scan are
# skipped since they don't depend on the token and already run in tests.yml.
# The integration test setup is skipped as well.
on:
  push:
    branches:
      - '**'
jobs:
  suite:
    uses: ./.github/workflows/_test-suite.yml
    with:
      run-code-quality-checks: false
      run-integration-test-setup: false
    # SONAR_TOKEN, SFM_PLATFORM_URL and SFM_PLATFORM_TOKEN are omitted - they are not used by this run.
    secrets:
      DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_PLATFORM_ENV_URL }}
      DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_PLATFORM_TOKEN }}
      DT_CLIENT_ID: ${{ secrets.DT_PLATFORM_CLIENT_ID }}
      DT_CLIENT_SECRET: ${{ secrets.DT_PLATFORM_CLIENT_SECRET }}
      DT_CLIENT_ID_SETTINGS_ADMIN: ${{ secrets.DT_CLIENT_ID_SETTINGS_ADMIN }}
      DT_CLIENT_SECRET_SETTINGS_ADMIN: ${{ secrets.DT_CLIENT_SECRET_SETTINGS_ADMIN }}
      DT_ACCOUNT_ID: ${{ secrets.DT_ACCOUNT_ID }}
      DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT: ${{ secrets.DT_GCP_TEST_UNIMPERSONABLE_SERVICE_ACCOUNT }}
      DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT: ${{ secrets.DT_GCP_TEST_IMPERSONABLE_SERVICE_ACCOUNT }}
      CREDENTIAL_VAULT_CERT: ${{secrets.CREDENTIAL_VAULT_CERT}}
      CREDENTIAL_VAULT_PWD: ${{secrets.CREDENTIAL_VAULT_PWD}}
