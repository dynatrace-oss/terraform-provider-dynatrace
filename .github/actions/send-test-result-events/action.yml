name: 'Send Test Events'
description: 'Sends one Dynatrace CASC_E2E_TEST event per test case to the platform ingest endpoint'
inputs:
  platform_url:
    description: 'The platform URL to send the events to'
    required: true
  platform_token:
    description: 'The platform access token needed for ingesting the events'
    required: true
  events_path:
    description: 'The ingest events path appended to <platform_url>/platform/ingest/'
    required: true
    default: 'custom/events.sdlc/cacapiingest'
  tests_file:
    description: 'Path to the file containing the JSON event payload to send'
    required: true
    default: 'test-report.json'

runs:
  using: 'composite'
  steps:
    - name: Send test events
      shell: bash
      env:
        PLATFORM_TOKEN: ${{ inputs.platform_token }}
        PLATFORM_URL: ${{ inputs.platform_url }}
        EVENTS_PATH: ${{ inputs.events_path }}
        TESTS_FILE: ${{ inputs.tests_file }}
      run: |
        set -euo pipefail
        if [ ! -s "$TESTS_FILE" ]; then
          echo "No payload found in '$TESTS_FILE' - nothing to send."
          exit 0
        fi
        echo "Sending payload from '$TESTS_FILE' to Dynatrace."
        curl -sS --fail-with-body \
          -H "Authorization: Bearer $PLATFORM_TOKEN" \
          -H 'Content-Type: application/json' \
          -X POST "$PLATFORM_URL/platform/ingest/$EVENTS_PATH" \
          --data-binary "@$TESTS_FILE"
