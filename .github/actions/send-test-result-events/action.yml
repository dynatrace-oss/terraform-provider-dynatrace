name: 'Send Failed Test Events'
description: 'Sends one Dynatrace CASC_E2E_TEST per test case read from a newline-delimited list'
inputs:
  platform_url:
    description: 'The platform URL to send the events to'
    required: true
  platform_token:
    description: 'The platform access token needed for ingesting the events'
    required: true
  events_path:
    description: 'The ingest events path appended to <platform_url>/platform/ingest/'
    required: true
    default: 'v1/custom/events.sdlc/cacapiingest'
  tests_file:
    description: 'Path to the newline-delimited list of executed tests (one "package/Test" per line)'
    required: true
    default: 'test-report.txt'

runs:
  using: 'composite'
  steps:
    - name: Send test events
      shell: bash
      env:
        PLATFORM_TOKEN: ${{ inputs.platform_token }}
        PLATFORM_URL: ${{ inputs.platform_url }}
        EVENTS_PATH: ${{ inputs.events_path }}
        TESTS_FILE: ${{ inputs.tests_file }}
        JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
      run: |
        set -euo pipefail
        if [ ! -s "$TESTS_FILE" ]; then
          echo "No tests found in '$TESTS_FILE' - nothing to send."
          exit 0
        fi
        # Build a JSON array with one CASC_E2E_TEST per test line.
        # jq -R -s reads the whole file as a raw string, then we split on
        # newlines and drop empty lines. Using jq guarantees proper JSON escaping.
        RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        payload=$(jq -R -s -c \
          --arg org "$GITHUB_REPOSITORY_OWNER" \
          --arg repoName "${GITHUB_REPOSITORY#*/}" \
          --arg ref "$GITHUB_REF" \
          --arg branch "$GITHUB_REF_NAME" \
          --arg sha "$GITHUB_SHA" \
          --arg eventName "$GITHUB_EVENT_NAME" \
          --arg actor "$GITHUB_ACTOR" \
          --arg workflow "$GITHUB_WORKFLOW" \
          --arg runId "$GITHUB_RUN_ID" \
          --arg runNumber "$GITHUB_RUN_NUMBER" \
          --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
          --arg runUrl "$RUN_URL" \
          --arg job "$JOB_CHECK_RUN_ID" \
          'split("\n")
           | map(select(length > 0))
           | map({
               "source": "GitHub",
               "type": "CASC_E2E_TEST",
               "test.name": .,
               "github.organization": $org,
               "github.repository": $repoName,
               "github.ref": $ref,
               "github.branch": $branch,
               "github.sha": $sha,
               "github.event_name": $eventName,
               "github.actor": $actor,
               "github.workflow": $workflow,
               "github.run_id": $runId,
               "github.run_number": $runNumber,
               "github.run_attempt": $runAttempt,
               "github.run_url": $runUrl,
               "github.job": $job
             })' "$TESTS_FILE")
        count=$(printf '%s' "$payload" | jq 'length')
        if [ "$count" -eq 0 ]; then
          echo "No tests to send after filtering - nothing to send."
          exit 0
        fi
        echo "Sending $count test event(s) to Dynatrace."
        curl -sS --fail-with-body \
          -H "Authorization: Bearer $PLATFORM_TOKEN" \
          -H 'Content-Type: application/json' \
          -X POST "$PLATFORM_URL/platform/ingest/$EVENTS_PATH" \
          --data-binary "$payload"